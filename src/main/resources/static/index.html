<!doctype html>
<html lang="ru">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Студенты</title
  ><link rel="stylesheet" href="style.css" />
  <body>
    <header>
      <b>Student / Учёт студентов</b><button id="logout" hidden>Выйти</button>
    </header>
    <main>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="login">
        <h1>Добро пожаловать</h1>
        <p>Войдите, чтобы открыть список студентов.</p>
        <form id="loginForm">
          <label
            >Email<input
              name="email"
              type="email"
              required
              autocomplete="username" /></label
          ><label
            >Пароль<input
              name="password"
              type="password"
              required
              autocomplete="current-password" /></label
          ><button>Войти</button>
        </form>
      </section>
      <section id="app" hidden>
        <h1 id="listTitle">Студенты</h1>
        <p id="account"></p>
        <div class="toolbar">
          <input
            id="search"
            aria-label="Поиск студентов"
            placeholder="Поиск по имени или фамилии"
          /><button id="refresh">Обновить</button
          ><button id="add" hidden>Добавить студента</button>
        </div>
        <p id="count"></p>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Фамилия</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <dialog id="editor">
      <form id="studentForm">
        <h2 id="formTitle"></h2>
        <label id="nameLabel"
          >Имя<input name="name" required maxlength="100" /></label
        ><label id="surnameLabel"
          >Фамилия<input name="surname" required maxlength="100" /></label
        ><label id="phoneLabel"
          >Телефон<input name="phoneNumber" type="tel" maxlength="50" /></label
        ><label>Email<input name="email" type="email" maxlength="254" /></label
        ><label id="passwordLabel" hidden
          >Пароль<input
            name="password"
            type="password"
            autocomplete="new-password"
        /></label>
        <fieldset id="rolesField" hidden>
          <legend>Роли</legend>
          <label
            ><input
              type="checkbox"
              name="role"
              value="TEACHER"
            />Преподаватель</label
          ><label
            ><input
              type="checkbox"
              name="role"
              value="ADMIN"
            />Администратор</label
          ><label
            ><input
              type="checkbox"
              name="role"
              value="SUPER_ADMIN"
            />Суперадминистратор</label
          >
        </fieldset>
        <div class="toolbar">
          <button id="save">Сохранить</button
          ><button type="button" id="close">Закрыть</button>
        </div>
        <p id="formError" role="alert"></p>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
